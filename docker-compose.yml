# Net-RAG — local / single-host deployment.
#
# Quick start:
#   docker compose up --build
#   UI  -> http://localhost:8501
#   API -> http://localhost:8000/health   (docs at /docs)
#
# Optional grounded LLM answers: create a .env (see .env.example) with LLM_MODEL + LLM_API_KEY.
# Compose auto-reads .env for the ${VAR} substitutions below; missing .env just uses defaults.
#
# NOTE: API runs a single uvicorn worker on purpose — the in-memory ingest job
# queue + FAISS single-writer semantics require one process. Scale ingest out via
# Redis/RQ (see docs/architecture.md) before adding API replicas.

services:
  netrag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: netrag-api:latest
    container_name: netrag-api
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - VECTOR_DB_DIR=/app/app/data/vector_db
      - TOP_K=${TOP_K:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-900}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-120}
      - HYBRID_ENABLED=${HYBRID_ENABLED:-true}
      - HYBRID_CANDIDATE_MULTIPLIER=${HYBRID_CANDIDATE_MULTIPLIER:-4}
      - HYBRID_DENSE_WEIGHT=${HYBRID_DENSE_WEIGHT:-0.7}
      - HYBRID_KEYWORD_WEIGHT=${HYBRID_KEYWORD_WEIGHT:-0.3}
      - HYBRID_RRF_K=${HYBRID_RRF_K:-60}
      - INCLUDE_DEV_METRICS=${INCLUDE_DEV_METRICS:-true}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-60}
    volumes:
      - netrag-data:/app/app/data
      - ./sample_docs:/app/sample_docs:ro
      - ./docs/eval_corpus:/app/docs/eval_corpus:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  netrag-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: netrag-ui:latest
    container_name: netrag-ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - NETRAG_API_BASE=http://netrag-api:8000
    depends_on:
      netrag-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  netrag-data:
