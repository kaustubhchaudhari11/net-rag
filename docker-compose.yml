# App code is copied into the image at build time (see Dockerfile.api).
# If /health does not show service "net-rag-api-manual-json-v1", rebuild after editing Python:
#   docker compose build netrag-api && docker compose up -d
services:
  netrag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: netrag-api
    ports:
      - "8000:8000"
    volumes:
      - ./app/data:/app/app/data
      - ./sample_docs:/app/sample_docs

  netrag-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: netrag-ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - NETRAG_API_BASE=http://netrag-api:8000
    depends_on:
      - netrag-api
